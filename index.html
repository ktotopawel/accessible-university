  <title>Akademia Jasnogrodzka</title>
  <!-- Restores text size / high contrast before first paint (no flash). Keys must match src/components/A11yToolbar.jsx. -->
  <script>(function(){var d=document.documentElement;d.classList.add('js');try{var t=localStorage.getItem('as-text-size');if(t==='2'||t==='3')d.classList.add('text-size-'+t);if(localStorage.getItem('as-high-contrast')==='1')d.classList.add('high-contrast');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap">
