server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Napisy WebVTT muszą mieć typ text/vtt (Firefox i Safari odrzucają inne typy).
    location ~ \.vtt$ {
        root   /usr/share/nginx/html;
        types  { text/vtt vtt; }
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
