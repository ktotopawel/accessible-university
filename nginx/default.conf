server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;

    # Single-page app: unknown paths (e.g. /schedule/informatyka) get index.html,
    # React Router shows the right page or "Nie ma takiej strony".
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Napisy WebVTT muszą mieć typ text/vtt (Firefox i Safari odrzucają inne typy).
    location ~ \.vtt$ {
        types  { text/vtt vtt; }
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
